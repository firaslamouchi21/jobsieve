name: ci
on:
  push:
  pull_request:
jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: tests
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          python -m pytest health_test/ -v --tb=short
      - name: light-install
        run: |
          python -m venv /tmp/light
          /tmp/light/bin/pip install --upgrade pip
          /tmp/light/bin/pip install .
          for mod in fastapi uvicorn streamlit playwright anthropic mcp; do
            if /tmp/light/bin/python -c "import $mod" 2>/dev/null; then
              echo "$mod must not be installed with the base package"
              exit 1
            fi
          done
          export MOCK_SEARCH=true DATA_DIR=/tmp/light-data
          /tmp/light/bin/jobsieve sources
          /tmp/light/bin/jobsieve fetch --source remoteok remotive arbeitnow --keyword python --json \
            | /tmp/light/bin/python -c "import json,sys; rows=json.load(sys.stdin); assert len(rows)==6, rows"

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: extension tests
        run: node --test extension/test/extract.test.js

  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install ".[all,dev]"
          pip install build
      - name: python-compile
        run: |
          python -m compileall -q .
      - name: unit-tests
        run: |
          python -m pytest health_test/ -v --tb=short
      - name: cli-smoke
        run: |
          python -m jobsieve.cli export --format json --limit 1
      - name: package-build
        run: |
          python -m build --wheel
      - name: package-namespace-check
        run: |
          python - <<'PY'
          import glob
          import sys
          import zipfile

          wheel = sorted(glob.glob("dist/*.whl"))[-1]
          names = zipfile.ZipFile(wheel).namelist()
          top_level_py = {n for n in names if n.endswith(".py") and "/" not in n}
          disallowed = {
              "db.py",
              "scraper.py",
              "cli.py",
              "ai_service.py",
              "notifications.py",
          }
          leaked = top_level_py & disallowed
          if leaked:
              print(f"flat top-level modules leaked into {wheel}: {leaked}")
              sys.exit(1)
          if not any(n.startswith("jobsieve/") for n in names):
              print(f"jobsieve package missing from {wheel}")
              sys.exit(1)
          if not any(n.startswith("jobsieve/sources/") for n in names):
              print(f"jobsieve.sources missing from {wheel}")
              sys.exit(1)
          print(f"OK: {wheel} only exposes jobsieve/*")
          PY
      - name: console-script-check
        run: |
          pip install --no-deps -e .
          jobsieve export --format json --limit 1
      - name: docker-build
        run: |
          docker compose build
          docker build -t jobsieve-combined -f Dockerfile .
      - name: scraper-health
        shell: bash
        run: |
          docker compose up -d scraper
          for i in {1..30}; do
            if curl -fsS http://localhost:8000/health >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs scraper || true
          exit 1
      - name: scraper-live-run
        shell: bash
        run: |
          MOCK_SEARCH=true docker compose up -d scraper
          up=1
          for i in {1..30}; do
            if curl -fsS http://localhost:8000/health >/dev/null 2>&1; then
              up=0
              break
            fi
            sleep 2
          done
          if [ "$up" -ne 0 ]; then
            docker compose logs scraper || true
            exit 1
          fi
          curl -fsS -X POST http://localhost:8000/run \
            -H "Content-Type: application/json" \
            -d '{"provider":"groq","lite_mode":true,"sites":["example.com"],"keywords":["python developer"],"cv_text":""}'
          status=""
          for i in {1..30}; do
            status=$(curl -fsS http://localhost:8000/status)
            if echo "$status" | grep -q '"message":"complete"'; then
              break
            fi
            sleep 1
          done
          echo "final status: $status"
          if ! echo "$status" | grep -q '"message":"complete"'; then
            docker compose logs scraper || true
            exit 1
          fi
          if ! echo "$status" | grep -q '"added":1'; then
            echo "expected added:1, got: $status"
            docker compose logs scraper || true
            exit 1
          fi
          jobs=$(curl -fsS "http://localhost:8000/jobs?limit=10")
          echo "jobs: $jobs"
          if ! echo "$jobs" | grep -q '"score":1'; then
            echo "expected a job scored 1, got: $jobs"
            exit 1
          fi
      - name: scraper-feed-sources
        shell: bash
        run: |
          curl -fsS -X POST http://localhost:8000/run \
            -H "Content-Type: application/json" \
            -d '{"provider":"groq","lite_mode":true,"sources":["remoteok","remotive","arbeitnow"],"keywords":["python"],"cv_text":""}'
          status=""
          for i in {1..30}; do
            status=$(curl -fsS http://localhost:8000/status)
            if echo "$status" | grep -q '"message":"complete"' && echo "$status" | grep -q '"added":6'; then
              break
            fi
            sleep 1
          done
          echo "final status: $status"
          if ! echo "$status" | grep -q '"added":6'; then
            echo "expected added:6, got: $status"
            docker compose logs scraper || true
            exit 1
          fi
      - name: ui-health
        shell: bash
        run: |
          docker compose up -d agent-ui
          for i in {1..30}; do
            if curl -fsS http://localhost:8501/_stcore/health >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs agent-ui || true
          exit 1
      - name: combined-dockerfile-health
        shell: bash
        run: |
          docker rm -f combined >/dev/null 2>&1 || true
          docker run -d --name combined \
            -e MOCK_SEARCH=true \
            -p 18000:8000 -p 18501:8501 \
            jobsieve-combined
          ok=1
          for i in {1..40}; do
            if curl -fsS http://localhost:18000/health >/dev/null 2>&1 \
              && curl -fsS http://localhost:18501/_stcore/health >/dev/null 2>&1; then
              ok=0
              break
            fi
            sleep 2
          done
          docker logs combined || true
          docker rm -f combined || true
          exit $ok
      - name: docker-down
        if: always()
        run: |
          docker compose down -v

  publish-to-pypi:
    needs: [core, extension, build-and-check]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/p/jobsieve
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: install-build-tools
        run: |
          python -m pip install --upgrade pip
          pip install build
      - name: tag-matches-version
        run: |
          python - <<'PY'
          import os, tomllib
          version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          assert tag == version, f"tag {tag} does not match pyproject version {version}; nothing published"
          PY
      - name: build-package
        run: python -m build
      - name: publish-to-pypi
        uses: pypa/gh-action-pypi-publish@release/v1
