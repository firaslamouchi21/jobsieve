services:
  - type: web
    name: jobsieve
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: standard
    healthCheckPath: /_stcore/health
    envVars:
      - key: API_HOST
        value: 127.0.0.1
      - key: DATA_DIR
        value: /data
      - key: GROQ_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: REQUEST_DELAY_SECONDS
        value: "2.0"
      - key: RETRY_MAX_ATTEMPTS
        value: "5"
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
