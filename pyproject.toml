[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jobsieve"
version = "2.0.0"
description = "Sifts job listings down to the ones you are eligible for: free, local-first, with optional AI scoring"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    {name = "Firas Lamouchi", email = "firaslamouchi21@gmail.com"}
]
keywords = ["jobsieve", "job-search", "ai", "remote-jobs", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31,<3",
    "beautifulsoup4>=4.12,<5",
    "ddgs>=9.0,<10",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
]
ui = [
    "streamlit>=1.41,<2",
]
browser = [
    "playwright==1.54.0",
]
ai = [
    "anthropic>=1.0,<3",
]
mcp = [
    "mcp>=1.2",
]
all = [
    "jobsieve[api,ui,browser,ai,mcp]",
]
dev = [
    "pytest>=7.0.0",
    "httpx>=0.27",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "jobsieve[api,mcp]",
]

[project.scripts]
jobsieve = "jobsieve.cli:main"
job-scraper = "jobsieve.cli:main"

[project.urls]
Homepage = "https://github.com/firaslamouchi21/jobsieve"
Repository = "https://github.com/firaslamouchi21/jobsieve"
Issues = "https://github.com/firaslamouchi21/jobsieve/issues"

[tool.setuptools.package-data]
jobsieve = ["data/*.json", "data/watchlists/*.json"]

[tool.setuptools.packages.find]
where = ["."]
include = ["jobsieve*"]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
target-version = "py310"
